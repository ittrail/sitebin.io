name: build & publish image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go test ./...              # community
      - run: go vet -tags ee ./... && go test -tags ee ./...  # enterprise

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - edition: community
            suffix: ""
          - edition: enterprise
            suffix: "-ee"
    steps:
      - uses: actions/checkout@v4
      # The enterprise image verifies licenses against Ed25519 ROOT public
      # keys baked in at build time (Dockerfile: LICENSE_ROOTS). They are
      # public keys, so they live in a plain repository VARIABLE, not a
      # secret: Settings -> Secrets and variables -> Actions -> Variables ->
      # LICENSE_ROOTS, comma-separated, standard base64. The stack's admin
      # portal offers the root under Settings -> licence root public key.
      #
      # An enterprise image built WITHOUT them trusts nothing: every published
      # -ee tag would be a 90-day trial that no license can ever unlock, and
      # nothing about it looks wrong until the trial ends. So the job refuses
      # to build one. `sitebin version` prints the number of roots a binary
      # trusts, which is how a runbook checks the artifact.
      - name: Refuse an enterprise image that would trust no license roots
        if: matrix.edition == 'enterprise'
        env:
          LICENSE_ROOTS: ${{ vars.LICENSE_ROOTS }}
        run: |
          if [ -z "${LICENSE_ROOTS//[[:space:]]/}" ]; then
            echo "::error title=LICENSE_ROOTS is not set::The enterprise image needs the license root public key(s). Set the LICENSE_ROOTS repository variable (Settings -> Secrets and variables -> Actions -> Variables) to the comma-separated base64 Ed25519 root public keys; see README 'Enterprise licensing'. Refusing to publish an -ee image that no license could ever unlock."
            exit 1
          fi
          echo "LICENSE_ROOTS carries $(echo "$LICENSE_ROOTS" | tr ',' '\n' | grep -c .) root(s)"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Published as ghcr.io/ittrail/sitebin.io (the repository's name),
          # with -ee appended for the enterprise edition. The compose files
          # and the README reference exactly this path.
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            EDITION=${{ matrix.edition }}
            LICENSE_ROOTS=${{ matrix.edition == 'enterprise' && vars.LICENSE_ROOTS || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
